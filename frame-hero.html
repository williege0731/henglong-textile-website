<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stage frame · hero</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css?v=8"/>
<link rel="stylesheet" href="css/effects.css?v=8"/>
<style>
  body{margin:0;overflow:hidden;background:#F4F2EF}
  .site-header{position:fixed}
  .stage{height:100vh!important}
  .stage-pin{position:relative!important;height:100vh!important;transform:none!important}
  .hero-title .line>span{transform:none!important;animation:none!important}
  .hero-kicker.split,.stage-hero .ghost-btn{opacity:1!important;animation:none!important}
  .float-card{opacity:1!important}
</style>
</head><body>
<header class="site-header on-hero">
  <div class="header-left"><button class="menu-btn" type="button"><span class="bars"><span></span><span></span></span>Menu</button></div>
  <a class="wordmark" href="index.html">恒隆纺织<small>Henglong Yarn-Dyed</small></a>
  <div class="header-right"><a href="products.html" style="color:#fff">Search</a><a href="about.html" style="color:#fff">关于</a><a href="contact.html" style="color:#fff">联系</a></div>
</header>

<section class="stage" data-stage data-phase="0" style="--p0:0.45;--hp:0;--fp:0;--gs:1;--p:0.02">
  <div class="stage-pin">
    <div class="stage-giant" style="opacity:0" aria-hidden="true"><span class="g1">探索</span><span class="g2">新面料</span></div>
    <div class="stage-floats"><div class="track"></div></div>
    <div class="stage-hero">
      <div class="hero-media"><img src="images/web/hero.jpg" alt=""/></div>
      <div class="hero-content first">
        <div class="hero-kicker split">New Collection</div>
        <h1 class="hero-title"><span class="line"><span>Exclusive</span></span><span class="line"><span>色织图鉴</span></span></h1>
        <a class="ghost-btn" href="products.html">Discover New Fabrics</a>
      </div>
      <div class="scroll-cue">Scroll to Discover</div>
    </div>
    <div class="stage-progress"><i></i><i></i><i></i></div>
  </div>
</section>
<script>document.documentElement.dataset.shotReady='1'</script>
</body></html>
